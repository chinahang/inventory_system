{% extends "base.html" %}
{% block title %}新建采购单{% endblock %}
{% block page_title %}新建采购单{% endblock %}

{% block extra_head %}
<style>
.search-wrap { position:relative; }
.search-input {
  width:100%; padding:6px 10px; font-size:13px;
  border:1px solid #e2e8f0; border-radius:6px;
  outline:none; transition:border-color .2s;
}
.search-input:focus { border-color:#6366f1; box-shadow:0 0 0 2px rgba(99,102,241,.15); }
.search-dropdown {
  position:absolute; top:100%; left:0; right:0; z-index:999;
  background:#fff; border:1px solid #e2e8f0; border-radius:6px;
  box-shadow:0 8px 24px rgba(0,0,0,.12); max-height:220px; overflow-y:auto;
  display:none; margin-top:2px;
}
.search-dropdown.open { display:block; }
.search-option {
  padding:8px 12px; cursor:pointer; font-size:13px;
  border-bottom:1px solid #f1f5f9; display:flex; justify-content:space-between; align-items:center;
}
.search-option:last-child { border-bottom:none; }
.search-option:hover { background:#f0f4ff; }
.search-option .mat-name { font-weight:500; color:#1e293b; }
.search-option .mat-code { font-size:11px; color:#94a3b8; }
.search-option .mat-meta { font-size:11px; color:#64748b; }
.search-selected {
  display:flex; align-items:center; justify-content:space-between;
  padding:5px 10px; background:#f0f4ff; border-radius:6px;
  font-size:12px; color:#4338ca; cursor:pointer; border:1px solid #c7d2fe;
}
.search-selected .clear-btn { color:#94a3b8; font-size:14px; font-weight:700; }
.search-selected .clear-btn:hover { color:#dc2626; }
.no-result { padding:10px 12px; font-size:13px; color:#94a3b8; text-align:center; }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
  <h1>新建采购单</h1>
  <p>填写采购单信息，提交后自动入库</p>
</div>

<div class="card">
  <div class="card-body">
    <div id="errorAlert" class="alert alert-danger d-none"></div>

    <div class="row g-3 mb-3">
      <div class="col-md-3">
        <label class="form-label fw-semibold">采购日期 *</label>
        <input type="date" id="order_date" class="form-control" required>
      </div>
      <div class="col-md-3">
        <label class="form-label fw-semibold">采购员 *</label>
        <select id="purchaser_id" class="form-select" required>
          <option value="">请选择采购员</option>
          {% for p in personnel %}
          <option value="{{ p.id }}">{{ p.name }}（{{ p.employee_id }}）</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label fw-semibold">供应商联系方式</label>
        <input type="text" id="supplier_contact" class="form-control" placeholder="手机/电话/微信等">
      </div>
      <div class="col-md-3">
        <label class="form-label fw-semibold">备注</label>
        <input type="text" id="remark" class="form-control" placeholder="选填">
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h6 class="mb-0 fw-semibold">采购明细</h6>
      <button type="button" class="btn btn-sm btn-outline-primary" onclick="addItem()">
        <i class="bi bi-plus-circle me-1"></i>添加物料
      </button>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered">
        <thead>
          <tr>
            <th style="width:36%">物料（支持名称/编号搜索）</th>
            <th style="width:14%">件数</th>
            <th style="width:18%">单价（元）</th>
            <th style="width:18%">金额（元）</th>
            <th style="width:14%">操作</th>
          </tr>
        </thead>
        <tbody id="itemsBody"></tbody>
        <tfoot>
          <tr class="table-light">
            <td colspan="3" class="text-end fw-semibold">合计金额：</td>
            <td colspan="2" class="fw-bold text-primary" id="totalAmount">¥ 0.00</td>
          </tr>
        </tfoot>
      </table>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-3">
      <a href="/purchase/ledger" class="btn btn-secondary">取消</a>
      <button type="button" class="btn btn-primary" id="submitBtn" onclick="submitForm()">
        <i class="bi bi-check-lg me-1"></i>提交采购单
      </button>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const materials = {{ materials | tojson }};
let itemCount = 0;
// selected material per row: {rowIdx -> material obj}
const selected = {};

document.getElementById('order_date').value = new Date().toISOString().split('T')[0];

/* ===== Fuzzy search widget ===== */
function createMaterialPicker(idx) {
  const wrap = document.createElement('div');
  wrap.className = 'search-wrap';
  wrap.innerHTML = `
    <input type="text" class="search-input" id="search-${idx}" placeholder="输入名称或编号搜索..."
      autocomplete="off" oninput="filterMaterials(${idx})" onfocus="openDropdown(${idx})" onblur="delayClose(${idx})">
    <div class="search-dropdown" id="dd-${idx}"></div>
    <div class="search-selected d-none" id="sel-${idx}">
      <span id="sel-text-${idx}"></span>
      <span class="clear-btn" onclick="clearSelection(${idx})">×</span>
    </div>`;
  return wrap;
}

function filterMaterials(idx) {
  const q = document.getElementById('search-' + idx).value.toLowerCase().trim();
  renderDropdown(idx, q);
}

function renderDropdown(idx, q) {
  const dd = document.getElementById('dd-' + idx);
  const filtered = q
    ? materials.filter(m =>
        m.name.toLowerCase().includes(q) ||
        m.code.toLowerCase().includes(q) ||
        (m.model && m.model.toLowerCase().includes(q))
      )
    : materials;
  if (!filtered.length) {
    dd.innerHTML = '<div class="no-result">未找到匹配物料</div>';
  } else {
    dd.innerHTML = filtered.map(m => `
      <div class="search-option" onmousedown="selectMaterial(${idx}, ${m.id})">
        <div>
          <div class="mat-name">${m.name}</div>
          <div class="mat-code">编号：${m.code}${m.model ? ' | 型号：'+m.model : ''}</div>
        </div>
        <div class="mat-meta">${m.unit || ''}</div>
      </div>`).join('');
  }
  dd.classList.add('open');
}

function openDropdown(idx) {
  const q = document.getElementById('search-' + idx)?.value || '';
  renderDropdown(idx, q.toLowerCase());
}

function delayClose(idx) {
  setTimeout(() => {
    const dd = document.getElementById('dd-' + idx);
    if (dd) dd.classList.remove('open');
  }, 200);
}

function selectMaterial(idx, matId) {
  const mat = materials.find(m => m.id === matId);
  if (!mat) return;
  selected[idx] = mat;
  // hide input, show selected tag
  document.getElementById('search-' + idx).classList.add('d-none');
  document.getElementById('dd-' + idx).classList.remove('open');
  const selEl = document.getElementById('sel-' + idx);
  document.getElementById('sel-text-' + idx).textContent = `${mat.name}（${mat.code}）`;
  selEl.classList.remove('d-none');
}

function clearSelection(idx) {
  selected[idx] = null;
  document.getElementById('search-' + idx).value = '';
  document.getElementById('search-' + idx).classList.remove('d-none');
  document.getElementById('sel-' + idx).classList.add('d-none');
  calcRow(idx);
}

function addItem() {
  const idx = itemCount++;
  const tr = document.createElement('tr');
  tr.id = 'row-' + idx;
  tr.innerHTML = `
    <td id="picker-cell-${idx}"></td>
    <td><input type="number" class="form-control form-control-sm" id="qty-${idx}"
      min="0.01" step="0.01" placeholder="数量" oninput="calcRow(${idx})"></td>
    <td><input type="number" class="form-control form-control-sm" id="price-${idx}"
      min="0" step="0.01" placeholder="单价" oninput="calcRow(${idx})"></td>
    <td><input type="number" class="form-control form-control-sm bg-light" id="total-${idx}" readonly></td>
    <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRow(${idx})">
      <i class="bi bi-dash-circle"></i></button></td>`;
  document.getElementById('itemsBody').appendChild(tr);
  document.getElementById('picker-cell-' + idx).appendChild(createMaterialPicker(idx));
}

function calcRow(idx) {
  const qty = parseFloat(document.getElementById('qty-' + idx)?.value) || 0;
  const price = parseFloat(document.getElementById('price-' + idx)?.value) || 0;
  const el = document.getElementById('total-' + idx);
  if (el) el.value = (qty * price).toFixed(2);
  updateTotal();
}

function updateTotal() {
  let sum = 0;
  document.querySelectorAll('[id^="total-"]').forEach(el => sum += parseFloat(el.value) || 0);
  document.getElementById('totalAmount').textContent = '¥ ' + sum.toFixed(2);
}

function removeRow(idx) {
  document.getElementById('row-' + idx)?.remove();
  delete selected[idx];
  updateTotal();
}

function submitForm() {
  const orderDate = document.getElementById('order_date').value;
  const purchaserId = document.getElementById('purchaser_id').value;
  if (!orderDate || !purchaserId) { showError('请填写采购日期和采购员'); return; }

  const items = [];
  for (const [idx, mat] of Object.entries(selected)) {
    if (!mat) continue;
    const qty = parseFloat(document.getElementById('qty-' + idx)?.value);
    const price = parseFloat(document.getElementById('price-' + idx)?.value) || 0;
    if (qty > 0) items.push({ material_id: mat.id, quantity: qty, unit_price: price });
  }
  if (!items.length) { showError('请至少添加一条有效物料明细'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>提交中...';

  const fd = new FormData();
  fd.append('order_date', orderDate);
  fd.append('purchaser_id', purchaserId);
  fd.append('supplier_contact', document.getElementById('supplier_contact').value);
  fd.append('remark', document.getElementById('remark').value);
  fd.append('items', JSON.stringify(items));

  fetch('/purchase/create', { method:'POST', body:fd })
    .then(r => { if (r.redirected) window.location.href = r.url; })
    .catch(e => { showError('提交失败：' + e); btn.disabled=false; btn.innerHTML='<i class="bi bi-check-lg me-1"></i>提交采购单'; });
}

function showError(msg) {
  const el = document.getElementById('errorAlert');
  el.textContent = msg; el.classList.remove('d-none');
  window.scrollTo(0,0);
  setTimeout(() => el.classList.add('d-none'), 5000);
}

addItem();
</script>
{% endblock %}
