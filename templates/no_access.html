{% extends "base.html" %}
{% block title %}无权访问{% endblock %}
{% block page_title %}无权访问{% endblock %}

{% block content %}
<div class="card mx-auto" style="max-width:520px;">
  <div class="card-body text-center py-5">
    <div style="font-size:44px;color:#f59e0b;"><i class="bi bi-shield-exclamation"></i></div>
    <h1 class="mt-3" style="font-size:18px;">当前角色未配置任何权限</h1>
    <p class="text-muted" style="font-size:13px;">
      账号「{{ user.full_name }}」（角色：{{ user.role }}）还没有被授予任何权限。<br>
      请联系管理员在「权限配置」中为该角色勾选权限后重新登录。
    </p>
    <a href="/logout" class="btn btn-outline-secondary btn-sm mt-2">
      <i class="bi bi-box-arrow-right me-1"></i>退出登录
    </a>
  </div>
</div>
{% endblock %}
